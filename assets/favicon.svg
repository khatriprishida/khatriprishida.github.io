<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="PK monogram">
  <style>
    .plate { fill: #E3EFE7; }
    .mono  { fill: #0F5132; }
    @media (prefers-color-scheme: dark) {
      .plate { fill: #12271D; }
      .mono  { fill: #5FD39A; }
    }
  </style>
  <rect class="plate" x="0" y="0" width="64" height="64" rx="12"/>
  <text class="mono" x="32" y="42" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="600">PK</text>
</svg>
